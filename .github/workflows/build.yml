name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu 26.04
    # ubuntu-latest (24.04) does not ship KDE Frameworks 6.
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build extra-cmake-modules \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev qt6-declarative-dev \
            libkf6texteditor-dev libkf6i18n-dev libkf6coreaddons-dev libkf6xmlgui-dev \
            libkf6syntaxhighlighting-dev libkf6pty-dev libkf6parts-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Install
        run: DESTDIR="$PWD/stage" cmake --install build --prefix /usr
